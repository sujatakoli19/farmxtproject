<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Orders | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-farmer_orders">

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo-section">

        <img src="logo.jpg" class="logo">

        <h2>FarmXT</h2>

    </div>

    <nav>

        <a href="farmer_dashboard.html">
            Dashboard
        </a>

        <a href="featured-listings.html">
            My Crops
        </a>

        <a href="farmer_profile.html">
            Profile
        </a>

        <a href="contact.html">
            Support
        </a>

        <a href="final.html" class="logout">
            Logout
        </a>

    </nav>

</header>


<!-- ================= ORDERS ================= -->

<section class="orders-section">

    <h1>📦 Orders Received</h1>

    <div
        class="orders-container"
        id="ordersContainer">

    </div>

</section>


<script>

/* =====================================================
   CHECK FARMER LOGIN
===================================================== */

let farmer =
    JSON.parse(
        localStorage.getItem("currentFarmer")
    );

if(!farmer){

    alert("Please login as a Farmer first.");

    window.location.href =
        "farmer_login.html";
}


/* =====================================================
   LOAD FARMER ORDERS
===================================================== */

function loadOrders(){

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];

    let container =
        document.getElementById(
            "ordersContainer"
        );

    container.innerHTML = "";


    /* =================================================
       FIND ORDERS BELONGING TO THIS FARMER
    ================================================= */

let farmerOrders =
orders.filter(function(order){

    return String(order.farmerId).trim() ===
           String(farmer.id).trim();

});

    /* =================================================
       NO ORDERS
    ================================================= */

    if(farmerOrders.length === 0){

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    📭 No Orders Received
                </h2>

                <p>
                    You currently have no orders
                    from customers.
                </p>

            </div>

        `;

        return;

    }


    /* =================================================
       DISPLAY ORDERS
    ================================================= */

    farmerOrders.forEach(function(order){

        let status =
            order.status || "Pending";


        let card =
            document.createElement("div");

        card.className =
            "order-card";


        card.innerHTML = `

    <h2>
        📦 Order #${escapeHTML(
            order.orderId || "N/A"
        )}
    </h2>

    <p>
        <strong>👤 Buyer Name:</strong>
        ${escapeHTML(
            order.buyerName ||
            "Not Available"
        )}
    </p>

    <p>
        🌾 <strong>Product:</strong>
        ${escapeHTML(
            order.productName ||
            "Not Available"
        )}
    </p>

    <p>
        <strong>📦 Quantity:</strong>
        ${escapeHTML(
            order.quantity ||
            "0"
        )} Kg
    </p>

    <p>
        <strong>📍 Delivery Address:</strong>
        ${escapeHTML(
            order.address ||
            "Not Available"
        )}
    </p>

    <p>
        <strong>💳 Payment Method:</strong>
        ${escapeHTML(
            order.paymentMethod ||
            "Not Available"
        )}
    </p>

    <p>
        <strong>💰 Price:</strong>
        ₹${escapeHTML(
            order.price ||
            "0"
        )}
    </p>

    <p>
        <strong>📅 Order Date:</strong>
        ${escapeHTML(
            order.date ||
            "Not Available"
        )}
    </p>

    <p>
        <strong>Order Status:</strong>

        <span class="status">

            ${escapeHTML(status)}

        </span>

    </p>

    <div class="buttons">

        <button
            class="accept-btn"
            onclick="acceptOrder('${order.orderId}')"
            ${status !== "Pending" ? "disabled" : ""}>

            ✅ Accept

        </button>

        <button
            class="reject-btn"
            onclick="rejectOrder('${order.orderId}')"
            ${status !== "Pending" ? "disabled" : ""}>

            ❌ Reject

        </button>

        <button
            class="ship-btn"
            onclick="shipOrder('${order.orderId}')"
            ${status !== "Accepted" ? "disabled" : ""}>

            🚚 Mark Shipped

        </button>

    </div>

`;

        container.appendChild(card);

    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ACCEPT ORDER
===================================================== */

function acceptOrder(orderId){

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    let order =
        orders.find(function(item){

            return String(item.orderId) ===
       String(orderId);

        });


    if(!order){
        alert("Order not found.");
        return;
    }


    order.status =
        "Accepted";


    order.acceptedAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "✅ Order Accepted Successfully!"
    );


    loadOrders();

}


/* =====================================================
   REJECT ORDER
===================================================== */

function rejectOrder(orderId){

    let confirmation =
        confirm(
            "Are you sure you want to reject this order?"
        );


    if(!confirmation){
        return;
    }


    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    let order =
        orders.find(function(item){

            return String(item.orderId) ===
       String(orderId);

        });


    if(!order){
        alert("Order not found.");
        return;
    }


    order.status =
        "Rejected";


    order.rejectedAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "❌ Order Rejected."
    );


    loadOrders();

}


/* =====================================================
   MARK SHIPPED
===================================================== */

function shipOrder(orderId){

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    let order =
        orders.find(function(item){

            return String(item.orderId) ===
       String(orderId);

        });


    if(!order){
        alert("Order not found.");
        return;
    }


    if(order.status !== "Accepted"){

        alert(
            "Please accept the order first."
        );

        return;

    }


    order.status =
        "Shipped";


    order.shippedAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "🚚 Order marked as Shipped!"
    );


    loadOrders();

}


/* =====================================================
   INITIALIZE
===================================================== */

if(farmer){

    loadOrders();

}

</script>

</body>
</html>
