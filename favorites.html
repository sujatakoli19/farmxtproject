<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-favorites">


<!-- ===== NAVBAR ===== -->

<header class="navbar">

    <div class="logo-section">

        <img src="logo.jpg" class="logo">

        <h2>FarmXT</h2>

    </div>

    <a href="market_place.html" class="back-btn">
        ⬅ Marketplace
    </a>

</header>


<!-- ===== PAGE HEADING ===== -->

<section class="heading">

    <h1>❤️ My Favorites</h1>

    <p>
        Manage your favorite products and favorite farmers.
    </p>

</section>


<!-- ================================================= -->
<!--              FAVORITE PRODUCTS                    -->
<!-- ================================================= -->

<section class="favorite-section">

    <h2 class="section-title">
        ❤️ Favorite Products
    </h2>

    <div
        id="favoriteContainer"
        class="container">
    </div>

</section>


<hr class="section-divider">


<!-- ================================================= -->
<!--              FAVORITE FARMERS                     -->
<!-- ================================================= -->

<section class="favorite-section">

    <h2 class="section-title">
        👨‍🌾 Favorite Farmers
    </h2>

    <div
        id="farmerContainer"
        class="container">
    </div>

</section>


<!-- ===== FOOTER ===== -->

<footer class="footer">

    <p>
        © 2026 FarmXT | Connecting Farmers and Buyers
    </p>

</footer>


<script>


/* ================================================= */
/*              FAVORITE PRODUCTS                    */
/* ================================================= */


let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];


let favoriteContainer =
    document.getElementById(
        "favoriteContainer"
    );


displayFavorites();


function displayFavorites(){

    favoriteContainer.innerHTML = "";


    if(favorites.length === 0){

        favoriteContainer.innerHTML = `

            <div class="empty">

                ❤️ No Favorite Products Yet

                <br><br>

                Go to the Marketplace and
                add products to your favorites.

            </div>

        `;

        return;

    }


    favorites.forEach(
        function(product,index){

            favoriteContainer.innerHTML += `

                <div class="card product-card">

                    <img
                        src="${product.image || 'default.jpg'}"
                        alt="${product.name}"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        👨‍🌾 Farmer:
                        ${product.farmer}
                    </p>

                    <p>
                        📱 ${product.mobile}
                    </p>

                    <div class="price">

                        ₹${product.price} / Kg

                    </div>


                    <button
                        class="buy-btn"
                        onclick="buyProduct(${index})">

                        🛒 Buy Now

                    </button>


                    <button
                        class="remove-btn"
                        onclick="removeFavorite(${index})">

                        ❌ Remove

                    </button>

                </div>

            `;

        }
    );

}


/* ===== REMOVE FAVORITE PRODUCT ===== */


function removeFavorite(index){

    favorites.splice(index,1);


    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );


    displayFavorites();

}


/* ===== BUY FAVORITE PRODUCT ===== */


function buyProduct(index){

    let product =
        favorites[index];


    localStorage.setItem(
        "selectedProduct",
        JSON.stringify(product)
    );


    window.location.href =
        "buy.html";

}



/* ================================================= */
/*              FAVORITE FARMERS                     */
/* ================================================= */


let favoriteFarmers =
    JSON.parse(
        localStorage.getItem(
            "favoriteFarmers"
        )
    ) || [];


let farmerContainer =
    document.getElementById(
        "farmerContainer"
    );


displayFavoriteFarmers();


function displayFavoriteFarmers(){

    farmerContainer.innerHTML = "";


    if(favoriteFarmers.length === 0){

        farmerContainer.innerHTML = `

            <div class="empty">

                👨‍🌾 No Favorite Farmers Yet

                <br><br>

                Go to the Marketplace and
                favorite a farmer.

            </div>

        `;

        return;

    }


    favoriteFarmers.forEach(
        function(farmer,index){

            farmerContainer.innerHTML += `

                <div class="farmer-card">

                    <div class="farmer-icon">
                        👨‍🌾
                    </div>


                    <h3>
                        ${farmer.name}
                    </h3>


                    <p>
                        📱 ${farmer.mobile}
                    </p>


                    <button
                        class="profile-btn"
                        onclick="viewFarmer('${farmer.mobile}')">

                        👤 View Farmer

                    </button>


                    <button
                        class="remove-btn"
                        onclick="removeFarmer(${index})">

                        ❌ Remove

                    </button>

                </div>

            `;

        }
    );

}


/* ===== REMOVE FAVORITE FARMER ===== */


function removeFarmer(index){

    favoriteFarmers.splice(index,1);


    localStorage.setItem(
        "favoriteFarmers",
        JSON.stringify(
            favoriteFarmers
        )
    );


    displayFavoriteFarmers();

}


/* ===== VIEW FARMER ===== */


function viewFarmer(mobile){

    let farmers =
        JSON.parse(
            localStorage.getItem("favoriteFarmers")
        ) || [];


    let selectedFarmer =
        farmers.find(
            function(farmer){

                return farmer.mobile === mobile;

            }
        );


    if(!selectedFarmer){

        alert("Farmer details not found.");

        return;

    }


    localStorage.setItem(
        "selectedFarmer",
        JSON.stringify(selectedFarmer)
    );


    /*
       We will connect this to your
       farmer profile/details page later.
    */

    alert(
        "Farmer: " +
        selectedFarmer.name +
        "\nMobile: " +
        selectedFarmer.mobile
    );

}


</script>


</body>

</html>
