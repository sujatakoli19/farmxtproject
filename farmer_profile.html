<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Profile | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-farmer_profile">
    <header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo">

<h2>FarmXT</h2>

</div>

<nav>

<a href="farmer_dashboard.html">Dashboard</a>

<a href="featured-listings.html">My Crops</a>

<a href="farmer_orders.html">Orders</a>

<a href="contact.html">Support</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>
<form>

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number" maxlength="10" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter email address">
</div>

<div class="input-box">
<label>Village / City</label>
<input type="text" placeholder="Enter your village or city">
</div>

<div class="input-box">
<label>Farm Name</label>
<input type="text" placeholder="Enter farm name">
</div>

<div class="input-box">
<label>Farm Area (Acres)</label>
<input type="number" placeholder="Enter farm area">
</div>

<div class="input-box">
<label>Main Crops</label>
<input type="text" placeholder="Example: Tomato, Potato, Onion">
</div>

<div class="input-box">
<label>Years of Experience</label>
<input type="number" placeholder="Enter years of experience">
</div>

<div class="input-box">
<label>Upload Profile Photo</label>
<input type="file" accept="image/*">
</div>

<div class="buttons">
<button type="button" class="edit-btn">Edit Profile</button>
<button type="submit" class="save-btn">Save Profile</button>
</div>

</form>

</body>

</html>
