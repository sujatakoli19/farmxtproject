<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Crops | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-manage_crops">

<header class="navbar">

<div class="logo-section">
<img src="logo.jpg" class="logo">
<h2>FarmXT Admin</h2>
</div>

<a href="admin_dashboard.html" class="back-btn">⬅ Dashboard</a>

</header>

<section class="heading">

<h1>🌾 Manage Crops</h1>

<p>View, edit and delete crop listings uploaded by farmers.</p>
<button onclick="window.location.href='manage_crops.html'"></button>


</section>

<div class="table-container">

<table id="cropTable">

<tr>
<th>Crop ID</th>
<th>Crop Name</th>
<th>Farmer</th>
<th>Price (₹/Kg)</th>
<th>Quantity (Kg)</th>
<th>Actions</th>
</tr>

<tr>
<td>CR001</td>
<td>Tomato</td>
<td>Ramesh Patil</td>
<td>40</td>
<td>200</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

<tr>
<td>CR002</td>
<td>Potato</td>
<td>Suresh Kumar</td>
<td>30</td>
<td>500</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

<tr>
<td>CR003</td>
<td>Onion</td>
<td>Mahesh Singh</td>
<td>35</td>
<td>350</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

</table>

</div>

<div class="footer">

© 2026 FarmXT Admin Panel

</div>

<script>

function deleteCrop(btn){

if(confirm("Are you sure you want to delete this crop listing?")){

btn.parentElement.parentElement.remove();

}

}

function editCrop(btn){

let row=btn.parentElement.parentElement;

let crop=prompt("Edit Crop Name",row.cells[1].innerHTML);

if(crop!=null && crop!=""){
row.cells[1].innerHTML=crop;
}

let farmer=prompt("Edit Farmer Name",row.cells[2].innerHTML);

if(farmer!=null && farmer!=""){
row.cells[2].innerHTML=farmer;
}

let price=prompt("Edit Price (₹/Kg)",row.cells[3].innerHTML);

if(price!=null && price!=""){
row.cells[3].innerHTML=price;
}

let quantity=prompt("Edit Quantity (Kg)",row.cells[4].innerHTML);

if(quantity!=null && quantity!=""){
row.cells[4].innerHTML=quantity;
}

alert("Crop details updated successfully.");

}

</script>

</body>
</html>
