<!DOCTYPE html>
<html lang="en">

<head>

<title>Farmer Controlled Pricing</title>


    
    
<link rel="stylesheet" href="style.css">
</head>


<body class="page-farmer_pricing">


<div class="container">


<img src="logo.jpg" alt="FarmXT Logo" class="logo">


<form onsubmit="addProduct(event)">


<h2>🌾 Set Your Product Price</h2>



<label>Product Name:</label>

<input 
type="text"
id="productName"
placeholder="Enter product name"
required>



<label>Product Quantity (kg):</label>

<input 
type="number"
id="quantity"
placeholder="Enter quantity"
required>



<label>Your Price (₹ per kg):</label>

<input 
type="number"
id="price"
placeholder="Set your own price"
required>



<label>Farm Location:</label>

<input 
type="text"
id="location"
placeholder="Enter farm location"
required>



<button type="submit">

➕ Add Product

</button>



</form>


</div>



<script>


function addProduct(event){

    event.preventDefault();


    let product={

        productName:
        document.getElementById("productName").value,


        quantity:
        document.getElementById("quantity").value,


        price:
        document.getElementById("price").value,


        location:
        document.getElementById("location").value

    };


    localStorage.setItem(
        "farmerProduct",
        JSON.stringify(product)
    );


    window.location.href="product_added.html";


}


</script>



    <script src="chatbot.js"></script>
</body>

</html>
