<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-contact">

<header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo-title">

<h2>FarmXT</h2>

</div>

<nav>

<a href="index.html">Home</a>

<a href="market_place.html">Marketplace</a>

<a href="community_network.html">Community</a>

<a href="direct_connection.html">Direct Connection</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>

<section class="contact-section">

<div class="contact-card">

<img src="logo.jpg" class="logo">

<h1>📞 Contact FarmXT</h1>

<p>Have any questions? We'd love to hear from you.</p>

<form id="contactForm">

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email address" required>

<label>Mobile Number</label>
<input type="tel" maxlength="10" placeholder="Enter mobile number" required>

<label>Subject</label>
<input type="text" placeholder="Enter subject" required>

<label>Message</label>
<textarea placeholder="Write your message here..." required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</section>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Thank you! Your message has been sent successfully.");

this.reset();

});

</script>

</body>

</html>
