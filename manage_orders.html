<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-manage_orders">

<header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo">

<h2>FarmXT Admin</h2>

</div>

<a href="admin_dashboard.html" class="back-btn">⬅ Dashboard</a>

</header>

<section class="heading">

<h1>📦 Manage Orders</h1>

<p>Track customer orders and update their delivery status.</p>
<button onclick="window.location.href='manage_orders.html'"></button>


</section>

<div class="table-container">

<table id="orderTable">

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Crop</th>
<th>Quantity</th>
<th>Total Amount</th>
<th>Status</th>
<th>Actions</th>
</tr>

<tr>
<td>ORD001</td>
<td>Rahul Sharma</td>
<td>Tomato</td>
<td>10 Kg</td>
<td>₹400</td>
<td>
<select>
<option>Pending</option>
<option>Processing</option>
<option>Shipped</option>
<option>Delivered</option>
<option>Cancelled</option>
</select>
</td>
<td>
<button class="update" onclick="updateOrder(this)">Update</button>
<button class="delete" onclick="deleteOrder(this)">Delete</button>
</td>
</tr>

<tr>
<td>ORD002</td>
<td>Priya Patel</td>
<td>Potato</td>
<td>20 Kg</td>
<td>₹600</td>
<td>
<select>
<option>Pending</option>
<option selected>Processing</option>
<option>Shipped</option>
<option>Delivered</option>
<option>Cancelled</option>
</select>
</td>
<td>
<button class="update" onclick="updateOrder(this)">Update</button>
<button class="delete" onclick="deleteOrder(this)">Delete</button>
</td>
</tr>

<tr>
<td>ORD003</td>
<td>Amit Verma</td>
<td>Onion</td>
<td>15 Kg</td>
<td>₹525</td>
<td>
<select>
<option>Pending</option>
<option>Processing</option>
<option selected>Shipped</option>
<option>Delivered</option>
<option>Cancelled</option>
</select>
</td>
<td>
<button class="update" onclick="updateOrder(this)">Update</button>
<button class="delete" onclick="deleteOrder(this)">Delete</button>
</td>
</tr>

</table>

</div>

<div class="footer">

© 2026 FarmXT Admin Panel

</div>

<script>

function updateOrder(btn){

let row = btn.parentElement.parentElement;
let status = row.cells[5].querySelector("select").value;

alert("Order status updated to: " + status);

}

function deleteOrder(btn){

if(confirm("Are you sure you want to delete this order?")){

btn.parentElement.parentElement.remove();

}

}

</script>

</body>
</html>
