<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Login | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-client_login">

<div class="login-box">

<img src="logo.jpg" class="logo">

<h2>📱 Client Login</h2>

<p class="subtitle">Login using Mobile OTP</p>

<form id="loginForm">

<label for="mobile">Mobile Number</label>

<input
    type="tel"
    id="mobile"
    name="mobile"
    maxlength="10"
    minlength="10"
    pattern="[0-9]{10}"
    inputmode="numeric"
    placeholder="Enter 10-digit Mobile Number"
    autocomplete="tel-national"
    required>
<button
type="button"
id="sendOtp">

Send OTP

</button>

<div id="otpSection">

<label>Enter OTP</label>

<input
type="text"
id="otp"
maxlength="6"
placeholder="Enter 6-digit OTP">

<div class="timer" id="timer"></div>

<button type="submit">

Verify OTP & Login

</button>

</div>

</form>

<div class="links">

<p>

New Client?

<a href="client_sign_up.html">

Create Account

</a>

</p>

<p>

<a href="final.html">

🏠 Back to Home

</a>

</p>

</div>

</div>

<script>

let generatedOTP="";
let seconds=30;
let timer;

// Allow only 10 numeric digits in mobile number
const mobileInput = document.getElementById("mobile");

mobileInput.addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "").slice(0, 10);
});


document.getElementById("sendOtp").addEventListener("click",function(){

let mobile=document.getElementById("mobile").value.trim();

if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter exactly 10 digits for the mobile number.");
    return;
}

// Check if client exists
let clients = JSON.parse(localStorage.getItem("clients")) || [];

let client = clients.find(c => c.mobile === mobile);

if(!client){
    alert("No account found. Please Sign Up first.");
    return;
}

generatedOTP=Math.floor(100000+Math.random()*900000).toString();

alert("Demo OTP : "+generatedOTP);

document.getElementById("otpSection").style.display="block";

this.disabled=true;

seconds=30;

document.getElementById("timer").innerHTML="Resend OTP in "+seconds+" sec";

timer=setInterval(function(){

seconds--;

document.getElementById("timer").innerHTML="Resend OTP in "+seconds+" sec";

if(seconds<=0){

clearInterval(timer);

document.getElementById("sendOtp").disabled=false;

document.getElementById("timer").innerHTML="You can resend OTP now.";

}

},1000);

});

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

let enteredOTP=document.getElementById("otp").value.trim();
if(enteredOTP===generatedOTP){

localStorage.setItem("userType","Client");
let clients = JSON.parse(localStorage.getItem("clients")) || [];

let client = clients.find(c => c.mobile === document.getElementById("mobile").value.trim());

localStorage.setItem("currentClient", JSON.stringify(client));

alert("Login Successful!");

window.location.href = "client_dashboard.html";

}else{

alert("Invalid OTP!");

}
});

</script>

</body>
</html>
