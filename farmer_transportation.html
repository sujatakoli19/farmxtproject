<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transportation | FarmXT</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>


    
<link rel="stylesheet" href="style.css">
</head>


<body class="page-farmer_transportation">


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo-section">

        <img
            src="logo.jpg"
            class="logo"
            alt="FarmXT Logo"
        >

        <h2>FarmXT</h2>

    </div>


    <nav>

        <a href="farmer_dashboard.html">
            Dashboard
        </a>

        <a href="produce_type.html">
            Upload Crop
        </a>

        <a href="featured_listings.html">
            My Crops
        </a>

        <a href="farmer_orders.html">
            Orders
        </a>

        <a href="farmer_profile.html">
            Profile
        </a>

        <a
            href="#"
            class="logout"
            onclick="logout(event)"
        >
            Logout
        </a>

    </nav>

</header>


<!-- ================= HEADER ================= -->

<section class="header">

    <h1>
        🚚 My Transportation
    </h1>

    <p>
        View transportation arrangements made by
        Bulk Buyers for your accepted crop requirements.
    </p>

</section>


<!-- ================= CONTENT ================= -->

<div class="container">

    <div
        id="transportContainer"
        class="transport-grid"
    >
    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>
        © 2026 FarmXT |
        Empowering Farmers Through Technology
    </p>

    <p>

        <a href="contact.html">
            Contact
        </a>

        |

        <a href="community_network.html">
            Community
        </a>

        |

        <a href="transparency.html">
            Transparency
        </a>

    </p>

</footer>


<script>


// =====================================================
// CHECK FARMER LOGIN
// =====================================================

let farmer =
    JSON.parse(
        localStorage.getItem("currentFarmer")
    );


if (!farmer) {

    alert(
        "Please login as a Farmer first."
    );

    window.location.href =
        "farmer_login.html";

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// LOAD TRANSPORTATION
// =====================================================

function loadTransportation() {

    let transportation =
        JSON.parse(
            localStorage.getItem(
                "farmXTTransportation"
            )
        ) || [];


    let interests =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerInterests"
            )
        ) || [];


    // =================================================
    // FIND THIS FARMER'S INTERESTS
    // =================================================

    let myInterestIds = interests

        .filter(function(interest) {

            return String(
                interest.farmerId
            ) === String(
                farmer.id
            );

        })

        .map(function(interest) {

            return String(
                interest.id
            );

        });


    // =================================================
    // FIND TRANSPORTATION
    // =================================================

    let myTransportation =
        transportation.filter(function(item) {

            return myInterestIds.includes(
                String(item.interestId)
            );

        });


    let container =
        document.getElementById(
            "transportContainer"
        );


    // =================================================
    // EMPTY
    // =================================================

    if (myTransportation.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    ⏳ No Transportation Arranged
                </h2>

                <p>
                    You currently do not have any
                    transportation arrangements.
                </p>

            </div>

        `;

        return;

    }


    // =================================================
    // DISPLAY
    // =================================================

    container.innerHTML = "";


    myTransportation.forEach(
        function(transport) {

            let status =
                String(
                    transport.status || "Arranged"
                ).toLowerCase();


            let isConfirmed =
                status === "confirmed";


            let deliveryStatus =
                String(
                    transport.deliveryStatus || ""
                ).toLowerCase();


            let card =
                document.createElement("div");


            card.className =
                "transport-card";


            card.innerHTML = `

                <h2>

                    🚚
                    ${escapeHTML(
                        transport.crop ||
                        "Crop Transportation"
                    )}

                </h2>


                <div class="detail">

                    <strong>
                        📦 Quantity:
                    </strong>

                    ${escapeHTML(
                        transport.quantity ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        🚛 Transport Type:
                    </strong>

                    ${escapeHTML(
                        transport.transportType ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        📍 Pickup:
                    </strong>

                    ${escapeHTML(
                        transport.pickupLocation ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        📍 Delivery:
                    </strong>

                    ${escapeHTML(
                        transport.deliveryLocation ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        📅 Pickup Date:
                    </strong>

                    ${escapeHTML(
                        transport.pickupDate ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        ⏰ Pickup Time:
                    </strong>

                    ${escapeHTML(
                        transport.pickupTime ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        💰 Transportation Cost:
                    </strong>

                    ₹${escapeHTML(
                        transport.transportCost ||
                        "0"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        🚛 Vehicle:
                    </strong>

                    ${escapeHTML(
                        transport.vehicleNumber ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        👨‍✈️ Driver:
                    </strong>

                    ${escapeHTML(
                        transport.driverName ||
                        "Not Available"
                    )}

                </div>


                <div class="detail">

                    <strong>
                        📞 Driver Contact:
                    </strong>

                    ${escapeHTML(
                        transport.driverPhone ||
                        "Not Available"
                    )}

                </div>


                ${
                    !isConfirmed

                    ?

                    `

                        <span class="status arranged">

                            🚚 Transportation Arranged

                        </span>


                        <button
                            class="confirm-btn"
                            onclick="confirmTransportation(
                                '${String(
                                    transport.id
                                ).replace(/'/g, "\\'")}'
                            )"
                        >

                            ✅ Confirm Transportation

                        </button>

                    `

                    :

                    deliveryStatus === "delivered"

                    ?

                    `

                        <span class="status delivered">

                            📦 Delivered

                        </span>


                        <div
                            style="
                                margin-top:15px;
                                padding:12px;
                                border-radius:15px;
                                background:rgba(34,197,94,.15);
                                color:#86efac;
                                text-align:center;
                                font-weight:bold;
                            "
                        >

                            ✓ Delivery Completed

                        </div>

                    `

                    :

                    deliveryStatus === "in transit"

                    ?

                    `

                        <span class="status in-transit">

                            📍 In Transit

                        </span>


                        <button
                            class="delivered-btn"
                            onclick="markDelivered(
                                '${String(
                                    transport.id
                                ).replace(/'/g, "\\'")}'
                            )"
                        >

                            📦 Mark Delivered

                        </button>

                    `

                    :

                    deliveryStatus === "dispatched"

                    ?

                    `

                        <span class="status dispatched">

                            🚛 Vehicle Dispatched

                        </span>


                        <button
                            class="transit-btn"
                            onclick="markInTransit(
                                '${String(
                                    transport.id
                                ).replace(/'/g, "\\'")}'
                            )"
                        >

                            📍 Mark In Transit

                        </button>

                    `

                    :

                    `

                        <span class="status confirmed">

                            ✓ Transportation Confirmed

                        </span>


                        <button
                            class="dispatch-btn"
                            onclick="markDispatched(
                                '${String(
                                    transport.id
                                ).replace(/'/g, "\\'")}'
                            )"
                        >

                            🚛 Mark Vehicle Dispatched

                        </button>

                    `
                }

            `;


            container.appendChild(card);

        }
    );

} // IMPORTANT: closes loadTransportation()


// =====================================================
// CONFIRM TRANSPORTATION
// =====================================================

function confirmTransportation(
    transportationId
) {

    let transportation =
        JSON.parse(
            localStorage.getItem(
                "farmXTTransportation"
            )
        ) || [];


    let selected =
        transportation.find(function(item) {

            return String(item.id) ===
                   String(transportationId);

        });


    if (!selected) {

        alert(
            "❌ Transportation arrangement not found."
        );

        return;

    }


    // =================================================
    // ALREADY CONFIRMED
    // =================================================

    if (
        String(
            selected.status || ""
        ).toLowerCase() === "confirmed"
    ) {

        alert(
            "Transportation is already confirmed."
        );

        return;

    }


    // =================================================
    // CONFIRMATION
    // =================================================

    let confirmation =
        confirm(
            "Have you reviewed the transportation details and do you want to confirm this arrangement?"
        );


    if (!confirmation) {

        return;

    }


    // =================================================
    // UPDATE STATUS
    // =================================================

    selected.status =
        "Confirmed";

    selected.confirmedAt =
        new Date().toLocaleString();

    selected.confirmedByFarmer =
        true;


    // =================================================
    // SAVE TRANSPORTATION
    // =================================================

    localStorage.setItem(
        "farmXTTransportation",
        JSON.stringify(
            transportation
        )
    );


    // =================================================
    // UPDATE RELATED INTEREST
    // =================================================

    let interests =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerInterests"
            )
        ) || [];


    let relatedInterest =
        interests.find(function(interest) {

            return String(interest.id) ===
                   String(selected.interestId);

        });


    if (relatedInterest) {

        relatedInterest.transportationStatus =
            "Confirmed";

        relatedInterest.transportationConfirmedAt =
            new Date().toLocaleString();

    }


    localStorage.setItem(
        "bulkBuyerInterests",
        JSON.stringify(
            interests
        )
    );


    alert(
        "✅ Transportation confirmed successfully!"
    );


    loadTransportation();

}


// =====================================================
// MARK VEHICLE DISPATCHED
// =====================================================

function markDispatched(
    transportationId
) {

    let transportation =
        JSON.parse(
            localStorage.getItem(
                "farmXTTransportation"
            )
        ) || [];


    let selected =
        transportation.find(function(item) {

            return String(item.id) ===
                   String(transportationId);

        });


    if (!selected) {

        alert(
            "❌ Transportation arrangement not found."
        );

        return;

    }


    let confirmation =
        confirm(
            "Has the vehicle been dispatched?"
        );


    if (!confirmation) {

        return;

    }


    selected.deliveryStatus =
        "Dispatched";

    selected.dispatchedAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "farmXTTransportation",
        JSON.stringify(
            transportation
        )
    );


    alert(
        "🚛 Vehicle marked as dispatched!"
    );


    loadTransportation();

}


// =====================================================
// MARK IN TRANSIT
// =====================================================

function markInTransit(
    transportationId
) {

    let transportation =
        JSON.parse(
            localStorage.getItem(
                "farmXTTransportation"
            )
        ) || [];


    let selected =
        transportation.find(function(item) {

            return String(item.id) ===
                   String(transportationId);

        });


    if (!selected) {

        alert(
            "❌ Transportation arrangement not found."
        );

        return;

    }


    let confirmation =
        confirm(
            "Has the vehicle started the journey?"
        );


    if (!confirmation) {

        return;

    }


    selected.deliveryStatus =
        "In Transit";

    selected.inTransitAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "farmXTTransportation",
        JSON.stringify(
            transportation
        )
    );


    alert(
        "📍 Shipment marked as In Transit!"
    );


    loadTransportation();

}


// =====================================================
// MARK DELIVERED
// =====================================================

function markDelivered(
    transportationId
) {

    let transportation =
        JSON.parse(
            localStorage.getItem(
                "farmXTTransportation"
            )
        ) || [];


    let selected =
        transportation.find(function(item) {

            return String(item.id) ===
                   String(transportationId);

        });


    if (!selected) {

        alert(
            "❌ Transportation arrangement not found."
        );

        return;

    }


    let confirmation =
        confirm(
            "Has the crop been delivered successfully?"
        );


    if (!confirmation) {

        return;

    }


    selected.deliveryStatus =
        "Delivered";

    selected.deliveredAt =
        new Date().toLocaleString();


    localStorage.setItem(
        "farmXTTransportation",
        JSON.stringify(
            transportation
        )
    );


    // =================================================
    // UPDATE RELATED INTEREST
    // =================================================

    let interests =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerInterests"
            )
        ) || [];


    let relatedInterest =
        interests.find(function(interest) {

            return String(interest.id) ===
                   String(selected.interestId);

        });


    if (relatedInterest) {

        relatedInterest.deliveryStatus =
            "Delivered";

        relatedInterest.deliveredAt =
            new Date().toLocaleString();

    }


    localStorage.setItem(
        "bulkBuyerInterests",
        JSON.stringify(
            interests
        )
    );


    alert(
        "📦 Delivery marked successfully!"
    );


    loadTransportation();

}


// =====================================================
// LOGOUT
// =====================================================

function logout(event) {

    event.preventDefault();


    localStorage.removeItem(
        "userType"
    );


    localStorage.removeItem(
        "currentFarmer"
    );


    localStorage.removeItem(
        "currentClient"
    );


    alert(
        "Logged Out Successfully!"
    );


    window.location.href =
        "final.html";

}


// =====================================================
// INITIALIZE
// =====================================================

if (farmer) {

    loadTransportation();

}

</script>


</body>

</html>
