<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
    
<link rel="stylesheet" href="style.css">
</head>


<body class="page-client_orders">


<!-- ===== NAVBAR ===== -->

<header class="navbar">

    <div class="logo-section">

        <img src="logo.jpg" class="logo">

        <h2>FarmXT</h2>

    </div>


    <a href="market_place.html" class="back-btn">

        🛒 Marketplace

    </a>

</header>


<!-- ===== HEADING ===== -->

<section class="heading">

    <h1>📦 My Orders</h1>

    <p>
        View all your orders placed through FarmXT.
    </p>

</section>


<!-- ===== ORDERS ===== -->

<div
    id="ordersContainer"
    class="orders-container">
</div>



<script>

let currentClient =
    JSON.parse(localStorage.getItem("currentClient"));

if (!currentClient) {

    alert("Please login first.");

    window.location.href = "client_login.html";

}

let allOrders =
    JSON.parse(localStorage.getItem("orders")) || [];


/* Show only this client's orders */

let orders = allOrders.filter(function(order) {

    return order.buyerMobile === currentClient.mobile;

});


let container =
    document.getElementById("ordersContainer");


displayOrders();


function displayOrders() {

    container.innerHTML = "";

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>📦 No Orders Yet</h2>
                <p>Your orders will appear here.</p>
            </div>
        `;

        return;
    }


    orders.forEach(function(order, index) {

        let cancelButton = "";


        /* Allow cancellation only for Pending orders */

        if (order.status === "Pending") {

            cancelButton = `
                <button
                    class="cancel-btn"
                    onclick="cancelOrder(${index})">
                    ❌ Cancel Order
                </button>
            `;

        }


        container.innerHTML += `

        <div class="order-card">

            <img
                src="${order.image || 'default.jpg'}"
                class="order-image">

            <div class="order-details">

                <h2>${order.productName}</h2>

                <p>
                    👨‍🌾 <strong>Farmer:</strong>
                    ${order.farmerName}
                </p>

                <p>
                    📦 <strong>Quantity:</strong>
                    ${order.quantity} Kg
                </p>

                <p>
                    💰 <strong>Price:</strong>
                    ₹${order.price} / Kg
                </p>

                <p>
                    💵 <strong>Total:</strong>
                    ₹${order.total}
                </p>

                <p>
                    💳 <strong>Payment:</strong>
                    ${order.paymentMethod}
                </p>

                <p>
                    📅 <strong>Ordered:</strong>
                    ${order.date}
                </p>

                <p>
                    📌 <strong>Status:</strong>
                    <span class="status ${order.status.toLowerCase()}">
                        ${order.status}
                    </span>
                </p>

                <div class="order-buttons">

                    <button
                        class="details-btn"
                        onclick="viewOrder(${index})">
                        👁️ View Details
                    </button>

                    ${cancelButton}

                </div>

            </div>

        </div>

        `;

    });

}


/* =========================
   CANCEL ORDER
========================= */

function cancelOrder(index) {

    let order = orders[index];


    if (order.status !== "Pending") {

        alert("This order cannot be cancelled.");

        return;

    }


    let confirmCancel =
        confirm(
            "Are you sure you want to cancel this order?"
        );


    if (!confirmCancel) {

        return;

    }


    /* Find the original order */

    let orderIndex =
        allOrders.findIndex(function(item) {

            return item.buyerMobile === order.buyerMobile &&
                   item.productName === order.productName &&
                   item.date === order.date;

        });


    if (orderIndex !== -1) {

        allOrders[orderIndex].status = "Cancelled";

    }


    localStorage.setItem(
        "orders",
        JSON.stringify(allOrders)
    );


    alert("Order cancelled successfully.");


    /* Reload orders */

    orders =
        allOrders.filter(function(order) {

            return order.buyerMobile === currentClient.mobile;

        });


    displayOrders();

}


/* =========================
   VIEW ORDER DETAILS
========================= */

function viewOrder(index) {

    localStorage.setItem(
        "selectedOrder",
        JSON.stringify(orders[index])
    );


    window.location.href =
        "order_details.html";

}

</script>
</script>


    <script src="chatbot.js"></script>
</body>

</html>
