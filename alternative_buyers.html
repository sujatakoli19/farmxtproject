<!DOCTYPE html>
<html>
<head>
    <title>Alternative Buyers Ecosystem</title>


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-alternative_buyers">

<div class="container">

    <img src="logo.jpg" alt="FarmXT Logo" class="logo">

    <h1>🌾 FarmXT Buyer Network</h1>

    <h2>Farmer Product Details</h2>

    <form>

        <label>Farmer Name:</label>
        <input type="text" placeholder="Enter farmer name">

        <label>Product Name:</label>
        <input type="text" placeholder="Enter product name">

        <label>Quantity (Kg):</label>
        <input type="number" placeholder="Enter quantity">

        <label>Price (₹ per Kg):</label>
        <input type="number" placeholder="Enter price">

        <button type="submit">📦 Submit Product</button>

    </form>

    <hr>

    <h2>Available Buyers</h2>

    <ul>
        <li>Fresh Food MSME</li>
        <li>Green Valley Restaurant</li>
        <li>City Retail Shop</li>
        <li>Bulk Vegetable Supplier</li>
    </ul>

</div>

</body>
</html>
