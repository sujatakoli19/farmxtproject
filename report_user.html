<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report User | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    
<link rel="stylesheet" href="style.css">
</head>

<body class="page-report_user">

<header class="navbar">

<div class="logo-section">
<img src="logo.jpg" class="logo">
<h2>FarmXT</h2>
</div>

<nav>
<a href="final.html">Home</a>
<a href="community_network.html">Community</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<div class="container">

<h1>🚨 Report User</h1>

<p class="subtitle">
Help us keep FarmXT safe by reporting suspicious farmers or customers.
</p>

<form id="reportForm">

<label>Report Against</label>

<select required>
<option value="">Select User Type</option>
<option>Farmer</option>
<option>Customer</option>
</select>

<label>Name of User</label>

<input
type="text"
placeholder="Enter Farmer or Customer Name"
required>

<label>Mobile Number (Optional)</label>

<input
type="tel"
placeholder="Enter Mobile Number">

<label>Reason for Report</label>

<select required>
<option value="">Select Reason</option>
<option>Fake Product</option>
<option>Fraud</option>
<option>Abusive Behaviour</option>
<option>Spam</option>
<option>Payment Issue</option>
<option>Other</option>
</select>

<label>Describe the Issue</label>

<textarea
placeholder="Write complete details about the issue..."
required></textarea>

<button type="submit">
Submit Report
</button>

</form>

<a href="final.html" class="back">⬅ Back to Home</a>

</div>

<script>

document.getElementById("reportForm").addEventListener("submit",function(e){

e.preventDefault();

alert("✅ Thank you! Your report has been submitted successfully.");

this.reset();

});

</script>

</body>
</html>
